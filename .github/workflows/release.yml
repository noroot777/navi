name: Release
run-name: release ${{ inputs.version }} ${{ inputs.source_sha }} ${{ inputs.publish && 'publish' || 'build' }}

# 一个版本一个 Release（tag v<版本>）：两个 Mac 架构和 Windows 并行构建、冒烟、各自存下原包；
# publish 等三份都过了，才把三个包放进同一个草稿 Release、核对、一次公开，再推各平台的更新源
# （desktop/shared/release-together.mjs）。publish=false 只构建和校验，不访问发布 Secret。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本，例如 0.3.6（mac 与 Windows 同一个）'
        required: true
        type: string
      source_sha:
        description: '已推送到 main 的完整提交 SHA'
        required: true
        type: string
      publish:
        description: '公开发布（关闭时只构建和校验，不访问发布 Secret）'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: navi-release
  cancel-in-progress: false

jobs:
  build-mac:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NAVI_MAC_VERSION: ${{ inputs.version }}
      NAVI_MAC_SOURCE_SHA: ${{ inputs.source_sha }}
      NAVI_MAC_PUBLISH: ${{ inputs.publish }}
      NAVI_MAC_ARCH: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Check publish configuration without exposing credentials
        if: inputs.publish
        env:
          RELEASE_READY: ${{ secrets.MAC_RELEASE_TOKEN != '' && secrets.MAC_SPARKLE_PRIVATE_KEY != '' }}
        run: |
          if [ "$RELEASE_READY" != true ]; then
            echo '配置 MAC_RELEASE_TOKEN 和 MAC_SPARKLE_PRIVATE_KEY Secrets 后再公开发布。' >&2
            exit 1
          fi
      - name: Validate request and locate recovery artifact
        id: request
        run: node desktop/macos/scripts/cloud-workflow.mjs validate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore original distribution
        if: steps.request.outputs.restore == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.request.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/navi-mac-release
      - name: Unpack and verify recovery artifact
        if: steps.request.outputs.restore == 'true'
        run: node desktop/macos/scripts/cloud-workflow.mjs restore
      - name: Cache verified downloads without app bundles or credentials
        if: steps.request.outputs.restore != 'true'
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm/_cacache
            desktop/macos/build/cache/*.tar.xz
          key: mac-downloads-v1-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('package-lock.json', 'desktop/macos/scripts/architecture.mjs', 'desktop/macos/scripts/sparkle.mjs') }}
          restore-keys: |
            mac-downloads-v1-${{ runner.os }}-${{ matrix.architecture }}-
      - name: Install build dependencies without release credentials
        if: steps.request.outputs.restore != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build app and seal original dmg
        if: steps.request.outputs.restore != 'true'
        run: node desktop/macos/scripts/cloud-workflow.mjs build
      - name: Smoke native runtime, sqlite, terminal and server
        run: node desktop/macos/scripts/smoke-distribution.mjs "$RUNNER_TEMP/navi-mac-release/payload/Navi.app"
      - name: Verify app signature and disk image
        run: node desktop/macos/scripts/cloud-workflow.mjs verify
      - name: Save original distribution before any publication
        if: steps.request.outputs.restore != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mac-release-${{ github.run_id }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/navi-mac-release/bundle.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  build-win:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      NAVI_WIN_VERSION: ${{ inputs.version }}
      NAVI_WIN_SOURCE_SHA: ${{ inputs.source_sha }}
      NAVI_WIN_PUBLISH: ${{ inputs.publish }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Check publish configuration without exposing credentials
        if: inputs.publish
        env:
          RELEASE_READY: ${{ secrets.MAC_RELEASE_TOKEN != '' && secrets.MAC_SPARKLE_PRIVATE_KEY != '' }}
        run: |
          if [ "$RELEASE_READY" != true ]; then
            echo '配置 MAC_RELEASE_TOKEN 和 MAC_SPARKLE_PRIVATE_KEY Secrets 后再公开发布（与 mac 版共用）。' >&2
            exit 1
          fi
      - name: Validate request and locate recovery artifact
        id: request
        run: node desktop/windows/scripts/cloud-workflow.mjs validate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore original installer
        if: steps.request.outputs.restore == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.request.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/navi-win-release/payload
      - name: Verify recovery artifact
        if: steps.request.outputs.restore == 'true'
        run: node desktop/windows/scripts/cloud-workflow.mjs restore
      - name: Cache verified downloads and tauri-cli without installers or credentials
        if: steps.request.outputs.restore != 'true'
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.npm/_cacache
            ~/.cargo/bin/cargo-tauri.exe
            ~/.cargo/registry/cache
            desktop/windows/build/cache
          key: win-downloads-v1-${{ hashFiles('package-lock.json', 'desktop/windows/shell/Cargo.lock', 'desktop/windows/scripts/build-shell.mjs', 'desktop/shared/runtime-bundle.mjs') }}
          restore-keys: |
            win-downloads-v1-
      - name: Install build dependencies without release credentials
        if: steps.request.outputs.restore != 'true'
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          cli=$(node --input-type=module -e 'console.log((await import("./desktop/windows/scripts/build-shell.mjs")).TAURI_CLI)')
          if ! cargo tauri --version 2>/dev/null | grep -qx "tauri-cli $cli"; then
            cargo install --locked tauri-cli --version "=$cli"
          fi
      - name: Build installer and record original digest
        if: steps.request.outputs.restore != 'true'
        run: node desktop/windows/scripts/cloud-workflow.mjs build
      - name: Verify installer
        run: node desktop/windows/scripts/cloud-workflow.mjs verify
      - name: Smoke install, bundled runtime, navi:// registration and uninstall
        run: |
          runtime=$(node -p 'require(process.env.RUNNER_TEMP + "/navi-win-release/payload/manifest.json").runtime')
          node desktop/windows/scripts/smoke-installer.mjs "$RUNNER_TEMP/navi-win-release/payload/Navi-$NAVI_WIN_VERSION-x64-setup.exe" --runtime "$runtime"
      - name: Save original installer before any publication
        if: steps.request.outputs.restore != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: win-release-${{ github.run_id }}
          path: ${{ runner.temp }}/navi-win-release/payload
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [build-mac, build-win]
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NAVI_MAC_VERSION: ${{ inputs.version }}
      NAVI_MAC_SOURCE_SHA: ${{ inputs.source_sha }}
      NAVI_MAC_PUBLISH: ${{ inputs.publish }}
      NAVI_WIN_VERSION: ${{ inputs.version }}
      NAVI_WIN_SOURCE_SHA: ${{ inputs.source_sha }}
      NAVI_WIN_PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.1'
          package-manager-cache: false
      - name: Locate the three verified original distributions
        id: request
        run: node desktop/shared/release-together.mjs locate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Checkout exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download Apple silicon distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.request.outputs.mac_arm64 }}
          merge-multiple: true
          path: ${{ runner.temp }}/navi-mac-release-arm64
      - name: Download Intel distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.request.outputs.mac_x64 }}
          merge-multiple: true
          path: ${{ runner.temp }}/navi-mac-release-x64
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.request.outputs.win }}
          merge-multiple: true
          path: ${{ runner.temp }}/navi-win-release/payload
      - name: Unpack and verify the original distributions
        run: node desktop/shared/release-together.mjs restore
      - name: Sign, publish one release with all three, then update feeds
        run: node desktop/shared/release-together.mjs publish
        env:
          GH_TOKEN: ${{ secrets.MAC_RELEASE_TOKEN }}
          MAC_SPARKLE_PRIVATE_KEY: ${{ secrets.MAC_SPARKLE_PRIVATE_KEY }}
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/navi-mac-signing" "$RUNNER_TEMP/navi-win-signing"
