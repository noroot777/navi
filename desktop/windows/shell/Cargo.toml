# Navi 的 Windows 壳（Tauri v2 + WebView2）。只做系统接口：窗口、托盘、拉起进程、单实例与深链；认人、起服务、
# 设置这些逻辑在自带运行时里的 desktop/windows/launcher/*.mjs（控制器），见 desktop/windows/README.md。
# 交叉编：desktop/windows/scripts/build-shell.mjs（cargo-xwin）；Windows 上原生：cargo build --release。
[package]
name = "navi"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "navi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
